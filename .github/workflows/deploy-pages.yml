name: Deploy MoneyMap to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'MoneyMap_v0.2_GitHub_upload.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          test -f MoneyMap_v0.2_GitHub_upload.zip
          mkdir -p public
          unzip -q MoneyMap_v0.2_GitHub_upload.zip -d extracted
          cp -a extracted/MoneyMap/. public/
          touch public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
